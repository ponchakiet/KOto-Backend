server:
  port: 8085
  servlet:
    context-path: /search-service

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 50MB
  elasticsearch:
    uris: https://localhost:9200
    username: elastic
    password: Ngocmai@1004
    index-recovery:
      mode: full
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  logging:
    level:
      org:
        elasticsearch:
          client: TRACE
        springframework:
          data:
            elasticsearch:
              client: TRACE

grpc:
  client:
    postServiceGrpc:
      address: "static://localhost:9194"
      negotiationType: PLAINTEXT