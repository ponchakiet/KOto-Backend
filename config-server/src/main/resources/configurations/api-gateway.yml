spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8443/realms/KOto
  cloud:
    gateway:
      actuator:
        enabled: true
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/user-service/api/v1/**
            - id: vehicle-service
              uri: lb:http://VEHICLE-SERVICE
              predicates:
                - Path=/vehicle-service/api/v1/**
            - id: post-service
              uri: lb:http://POST-SERVICE
              predicates:
                - Path=/post-service/api/v1/**
            - id: search-service
              uri: lb:http://SEARCH-SERVICE
              predicates:
                - Path=/search-service/api/v1/**
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG
    reactor.netty: INFO
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

app:
  cors:
    allowed-origin: http://localhost:5173/