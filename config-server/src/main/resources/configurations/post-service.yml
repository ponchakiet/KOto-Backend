server:
  port: 8083
  servlet:
    context-path: /post-service

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/koto_postdb
    username: postgres
    password: Ngocmai@1004
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    producer:
      bootstrap-servers: 127.0.0.1:19091,127.0.0.1:19092,127.0.0.1:19093
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    #      properties:
    #        spring.json.type.mapping: paymentEvent:poncha.kiet.paymentservice.event.PaymentEvent

    consumer:
      group-id: koto-post
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: paymentEvent:poncha.kiet.postservice.event.PaymentEvent
      auto-offset-reset: earliest

grpc:
  client:
    vehicleServiceGrpc:
      address: "discovery:///vehicle-service"
      negotiationType: PLAINTEXT
    userServiceGrpc:
      address: "discovery:///user-service"
      negotiationType: PLAINTEXT
    paymentServiceGrpc:
      address: "discovery:///payment-service"
      negotiationType: PLAINTEXT
  server:
    port: 9194
    enable-reflection: true

resilience4j:
  circuitbreaker:
    instances:
      userServiceCB:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
      vehicleServiceCB:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  retry:
    instances:
      userServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms
      vehicleServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers