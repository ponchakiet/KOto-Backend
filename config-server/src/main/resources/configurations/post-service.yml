server:
  port: 8083
  servlet:
    context-path: /post-service

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/koto_postdb
    username: postgres
    password: Ngocmai@1004
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

grpc:
  client:
    vehicleServiceGrpc:
      address: "discovery:///vehicle-service"
      negotiationType: PLAINTEXT
    userServiceGrpc:
      address: "discovery:///user-service"
      negotiationType: PLAINTEXT
    paymentServiceGrpc:
      address: "discovery:///payment-service"
      negotiationType: PLAINTEXT
  server:
    port: 9094
    enable-reflection: true