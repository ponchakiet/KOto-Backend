server:
  port: 8086
  servlet:
    context-path: /payment-service

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres/koto_paymentdb
    username: postgres
    password: Ngocmai@1004
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    producer:
      bootstrap-servers: 127.0.0.1:19091,127.0.0.1:19092,127.0.0.1:19093
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: orderEvent:poncha.kiet.paymentservice.event.OrderEvent

    consumer:
      group-id: saga-service
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: paymentEvent:poncha.kiet.paymentservice.event.PaymentEvent
      auto-offset-reset: earliest

