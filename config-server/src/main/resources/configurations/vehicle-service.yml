server:
  port: 8082
  servlet:
    context-path: /vehicle-service

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 50MB
  cloud:
    discovery:
      enabled: true
  data:
    mongodb:
      host: localhost
      port: 27017
      database: koto_vehicle
grpc:
  client:
    userServiceGrpc:
      address: "discovery:///user-service"
      negotiationType: PLAINTEXT
    postServiceGrpc:
      address: "discovery:///post-service"
      negotiationType: PLAINTEXT
    uploadServiceGrpc:
      address: "discovery:///upload-service"
      negotiationType: PLAINTEXT
  server:
    port: 9193
    enable-reflection: true