server:
  port: 8082
  servlet:
    context-path: /vehicle-service

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 50MB
  cloud:
    discovery:
      enabled: true
  data:
    mongodb:
      host: localhost
      port: 27017
      database: koto_vehicle
grpc:
  client:
    userServiceGrpc:
      address: "static://localhost:9191"
      negotiationType: PLAINTEXT
    postServiceGrpc:
      address: "static://localhost:9194"
      negotiationType: PLAINTEXT
    uploadServiceGrpc:
      address: "static://localhost:9192"
      negotiationType: PLAINTEXT
  server:
    port: 9193
    enable-reflection: true

resilience4j:
  retry:
    retryAspectOrder: 1
    instances:
      postServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms

  circuitbreaker:
    circuitBreakerAspectOrder: 2
    instances:
      postServiceCB:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers