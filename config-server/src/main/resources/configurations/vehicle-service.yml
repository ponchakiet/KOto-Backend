server:
  port: 8082
  servlet:
    context-path: /vehicle-service

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 50MB
  cloud:
    discovery:
      enabled: true
  data:
    mongodb:
      host: localhost
      port: 27017
      database: koto_vehicle
grpc:
  client:
    userServiceGrpc:
      address: "static://localhost:9091"
      negotiationType: PLAINTEXT
    postServiceGrpc:
      address: "static://localhost:9094"
      negotiationType: PLAINTEXT
    uploadServiceGrpc:
      address: "static://localhost:9092"
      negotiationType: PLAINTEXT
  server:
    port: 9093
    enable-reflection: true