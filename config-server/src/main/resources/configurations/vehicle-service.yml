server:
  port: 8082
  servlet:
    context-path: /vehicle-service

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 50MB
  data:
    mongodb:
      authentication-database: admin
      database: koto_vehicle
      username: admin
      password: 123456
      host: localhost
      port: 27017
grpc:
  client:
    userServiceGrpc:
      address: "static://localhost:9091"
      negotiationType: PLAINTEXT