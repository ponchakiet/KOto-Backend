syntax = "proto3";
option java_multiple_files = true;
option java_package = "poncha.kiet.postservice.grpc";
option java_outer_classname = "VehicleToPostProto";

service VehicleToPostService {
  rpc checkExisted(VehicleRequest) returns (CheckExistedResponse);
  rpc getVehicleDetail(VehicleRequest) returns (VehicleResponse);
  rpc getPoster(VehicleRequest) returns (Content);
}

message VehicleRequest {
  string id = 1;
  string userId = 2;
}

message CheckExistedResponse {
  string id = 1;
  bool isExisted = 2;
}

message VehicleResponse {
  string id = 1;
  string province = 2;
  string ward = 3;
  string address = 4;
  double price = 5;
  int32 manufactureYear = 6;
  map<string, string> properties = 7;
  repeated Content contentList = 8;
  repeated string otherInfo = 9;
  CategoryResponse category = 10;
}

message CategoryResponse {
  string id = 1;
  string name = 2;
}

message Content {
  string id = 1;
  string url = 2;
  string name = 3;
  double duration = 4;
  string type = 5;
}